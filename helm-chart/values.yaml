# Default values for go-sse.

# -- Number of replicas. Used if autoscaling is false
replicaCount: 2

# -- Update strategy configurations
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 6
    maxUnavailable: 0

# Docker images of go-sse
# https://hub.docker.com/r/aeciopires/go-sse

image:
  # -- Docker image name
  repository: aeciopires/go-sse
  # -- Pull policy of Docker image
  pullPolicy: IfNotPresent
  # -- Docker image tag (defaults to the chart appVersion)
  tag: "2.0.0"

# -- List of dockerconfig secrets names to use when pulling images
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Pod annotations configurations
podAnnotations: {}

# -- Extra pod labels
podLabels: {}

# -- Log level of the application: DEBUG, INFO, WARN or ERROR. Logs are written to stdout in JSON format.
logLevel: INFO

sse:
  # -- Interval between "update" SSE events (Go duration)
  eventInterval: 2s

shutdown:
  # -- Time the pod keeps serving after readiness turns false, so endpoints/load balancers stop routing traffic (Go duration)
  delay: 5s
  # -- Maximum time for in-flight requests to finish during shutdown (Go duration)
  timeout: 15s

# -- Seconds Kubernetes waits before killing the pod. Must be greater than shutdown.delay + shutdown.timeout
terminationGracePeriodSeconds: 30

# OpenTelemetry (traces and logs exported via OTLP/HTTP)
otel:
  # -- Enables OTLP export of traces and logs
  enabled: false
  # -- OTLP/HTTP endpoint, e.g. an OpenTelemetry Collector or Grafana Alloy (http://otel-collector.observability:4318)
  endpoint: ""
  # -- Service name reported in traces and logs (defaults to the chart name)
  serviceName: ""
  # -- Extra OTEL resource attributes (comma-separated key=value)
  resourceAttributes: ""

# -- Extra environment variables for the container
env: []
  # - name: OTEL_EXPORTER_OTLP_HEADERS
  #   value: "authorization=Bearer TOKEN"

# -- Pod security configurations
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container security context configurations
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Type of service in Kubernetes cluster
  type: NodePort
  # -- Port of service in Kubernetes cluster
  port: 80
  # -- Create GCP Backend and Frontend Config
  createGcpBackendAndFrontendConfig: false
  # -- Annotations of service
  annotations: {}

# Ingress configurations
ingress:
  # -- Enables Ingress
  enabled: false
  # -- Create GCP Managed Certificate
  createGcpManagedCertificate: false
  # -- Create Cert Manager Issuer
  createCertManagerIssuer: false
  # -- Email for Cert Manager Issue
  certManagerIssueEmail: "CHANGE_HERE"
  className: ""
  # -- Ingress annotations
  annotations:
    #--- Annotations to create loadbalancer in AWS of the type application for external access of the VPC
    #kubernetes.io/ingress.class: alb
    #alb.ingress.kubernetes.io/scheme: internet-facing
    #alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #alb.ingress.kubernetes.io/ssl-redirect: "443"
    #alb.ingress.kubernetes.io/healthcheck-path: "/"
    #alb.ingress.kubernetes.io/healthcheck-port: http
    #alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:AWS_REGION:AWS_ACCOUNT:certificate/ID_ACM_CERTIFICATE
    #alb.ingress.kubernetes.io/tags: Scost=go-sse, Environment=testing, Terraform=true, Kubernetes=true
    #--- Annotations to use nginx-ingress
    #kubernetes.io/ingress.class: nginx
    #kubernetes.io/tls-acme: "true"
    #--- Annotations to create loadbalancer in GCP of the type application for external access of the VPC
    #kubernetes.io/ingress.class: "gce"
    #kubernetes.io/ingress.allow-http: "true"
    ## Name of static IP previous created in GCP
    #kubernetes.io/ingress.global-static-ip-name: go-sse
    #networking.gke.io/v1beta1.FrontendConfig: go-sse-frontend-config
    ## Optional Annotation for GCP Managed Certificate
    #networking.gke.io/managed-certificates: go-sse-cert
    ## Syntax '{"service_port_number/service_port_name:protocol"}'
    #cloud.google.com/app-protocols: '{"http":"HTTP"}'
    #--- Optional Annotation for cert-manager
    #cert-manager.io/issuer: letsencrypt-production
  # -- Ingress hosts
  hosts: []
    #- host: go-sse.aeciopires.com
    #  paths:
    #    - path: /
    #      pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: go-sse-cert-empty
  #    hosts:
  #      - go-sse.aeciopires.com

# -- Requests and limits of pod resources.
# See: [https://kubernetes.io/docs/concepts/configuration/manage-resources-containers](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers)
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 32Mi

# -- Auto scaling configurations
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Startup probe: protects slow starts; liveness/readiness only run after it succeeds. Set to null to disable
startupProbe:
  # -- Path of the startup check
  path: /livez
  # -- Specifies that the kubelet should perform the probe every N seconds
  periodSeconds: 2
  # -- Number of seconds after which the probe times out
  timeoutSeconds: 2
  # -- Number of failures before the container is restarted
  failureThreshold: 30

# -- Readiness probe: the pod receives traffic only while it returns 200 (fails during shutdown)
readinessProbe:
  # -- Path of readiness check of application
  path: /readyz
  # -- Number of seconds after the container has started before readiness
  initialDelaySeconds: 0
  # -- Specifies that the kubelet should perform a readiness probe every N seconds
  periodSeconds: 5
  # -- Number of seconds after which the probe times out
  timeoutSeconds: 3
  # -- Minimum consecutive successes for the probe to be considered successful after having failed
  successThreshold: 1
  # -- When a probe fails, Kubernetes will try failureThreshold times before giving up.
  # Giving up in case of liveness probe means restarting the container.
  # In case of readiness probe the Pod will be marked Unready
  failureThreshold: 3

# -- Liveness probe: the container is restarted when it fails
livenessProbe:
  # -- Path of liveness check of application
  path: /livez
  # -- Number of seconds after the container has started before liveness
  initialDelaySeconds: 0
  # -- Specifies that the kubelet should perform a liveness probe every N seconds
  periodSeconds: 10
  # -- Number of seconds after which the probe times out
  timeoutSeconds: 3
  # -- Minimum consecutive successes for the probe to be considered successful after having failed
  successThreshold: 1
  # -- When a probe fails, Kubernetes will try failureThreshold times before giving up.
  # Giving up in case of liveness probe means restarting the container.
  # In case of readiness probe the Pod will be marked Unready
  failureThreshold: 3

# -- Node selector configurations
nodeSelector: {}

# -- Tolerations configurations
tolerations: []

# -- Affinity configurations
affinity: {}
#  podAntiAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#    - labelSelector:
#        matchLabels:
#          app.kubernetes.io/name: go-sse
#      namespaces:
#      - go-sse
#      topologyKey: kubernetes.io/hostname

# -- Service monitor configurations
serviceMonitor:
  enabled: false
  additionalLabels: {}
  path: "/metrics"
  interval: "30s"
  scrapeTimeout: "10s"
  namespace: "go-sse"
  namespaceSelector: {}

# -- Extra arbitrary Kubernetes manifests to deploy within the release
extraManifests: []

# -- Grafana dashboard (metrics, logs and traces) as a ConfigMap discovered by the Grafana sidecar
grafanaDashboard:
  enabled: false
  # -- Namespace of the ConfigMap (defaults to the release namespace)
  namespace: ""
  # -- Labels used by the Grafana sidecar to discover dashboards
  labels:
    grafana_dashboard: "1"
  # -- Annotations, e.g. the Grafana folder used by the sidecar
  annotations:
    grafana_folder: go-sse

# -- Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: false
  # -- Minimum available pods
  minAvailable: 25%

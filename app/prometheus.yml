# Prometheus configuration file
global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Default evaluation interval

# Scrape configurations
scrape_configs:
  - job_name: 'go-sse'
    static_configs:
      - targets: ['go-sse:8080'] # Target the go-sse service
    metrics_path: '/metrics' # Path where metrics are exposed
